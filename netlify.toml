[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["firebase-applet-config.json"]
  external_node_modules = ["firebase-admin"]

# Route all /api/* requests to the serverless Express/Web handler
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback (e.g. /invite/:id)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow Firebase Auth signInWithPopup to communicate cleanly across origins
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
